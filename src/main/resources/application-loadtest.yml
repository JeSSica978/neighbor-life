# Dedicated process only. Never use the existing default startup/health wrappers for this profile.
server:
  address: 127.0.0.1
  port: ${LT_SERVER_PORT:8082}
spring:
  datasource:
    url: ${LT_MYSQL_URL:jdbc:mysql://${LT_MYSQL_HOST:127.0.0.1}:${LT_MYSQL_PORT:3307}/hmdp_loadtest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&tinyInt1isBit=false}
    username: lt_app
    password: ${LT_MYSQL_APP_PASSWORD}
  redis:
    host: ${LT_REDIS_HOST:127.0.0.1}
    port: ${LT_REDIS_PORT:6380}
    database: 0
    # This dedicated loopback instance has no authentication; override any inherited password/URL.
    password: ""
    url: ""
    ssl: false
  kafka:
    bootstrap-servers: ${LT_KAFKA_HOST:127.0.0.1}:${LT_KAFKA_PORT:9093}
    consumer:
      group-id: loadtest-orders-${LT_RUN_ID}
hmdp:
  seckill:
    topic: loadtest-seckill-${LT_RUN_ID}
    outbox: loadtest:outbox:${LT_RUN_ID}
  reliable:
    cache-topic: loadtest-cache-delete-${LT_RUN_ID}
    stock-topic: loadtest-stock-restore-${LT_RUN_ID}
    cache-group: loadtest-cache-${LT_RUN_ID}
    stock-group: loadtest-stock-${LT_RUN_ID}
# Preserve SQL DEBUG and banner settings inherited from application.yaml.
# Only hide OTPs in this dedicated process: tokens/codes do not belong in benchmark logs.
logging:
  level:
    com.hmdp.service.impl.UserServiceImpl: info
